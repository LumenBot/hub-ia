# Golden set initial — sprint S1 (10 questions)
#
# 2 questions par unité pilote (CU-001, CU-008, PR-07, DEP-02, outils-vector-db).
# Format minimaliste. Enrichissement à 30 questions prévu en S2.
#
# Champs :
#   id              : identifiant stable
#   question        : énoncé tel que posé à query.py
#   expected_sources: codes attendus en citation (case-insensitive)
#   expected_concepts: termes/notions devant apparaître dans la réponse
#                      (matching sous-chaîne case-insensitive)
#   unit            : unité pilote ciblée

- id: q-001
  question: "Qu'est-ce que la veille IA et comment la structurer dans une PME ?"
  expected_sources: [cu-001]
  expected_concepts: [veille, source, méthode]
  unit: cu-001

- id: q-002
  question: "Quelles sont les sources fiables pour suivre l'actualité IA générative en 2026 ?"
  expected_sources: [cu-001]
  expected_concepts: [source, veille]
  unit: cu-001


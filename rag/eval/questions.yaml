# Golden set v2 — sprint S2.3 (42 questions)
#
# Évolutions S2.3 par rapport à S2.2 :
# - Format `expected_concepts` enrichi avec option B (liste de listes) pour synonymes
#   - Rétro-compatibilité : scalaire seul (string) reste valide
#   - Mix scalaire + liste autorisé au sein d'une même entrée
# - Résolution des 5 faux négatifs identifiés dans RAPPORT-CC-S2.2 §7 :
#   q-001 (méthode), q-012 (vérification), q-016 (1,8 heures), q-028 (persistant), q-029 (économie)
# - Élargissement morphologique ciblé sur les questions où des variations sont attendues
# - Ajout de 12 nouvelles questions vague 3 (q-031 → q-042) pour cu-026, cu-027, dep-08
#   (9 questions initiales + 3 questions bonus issues du RETOUR-SONDAGE-COWORK-HUB-IA-S2.3)
# - Alignement avec formulations canoniques du Hub via RETOUR-SONDAGE (D-026 validé empiriquement) :
#   4 dérives sémantiques majeures évitées avant production MD vague 3
#
# Discipline AP-5 (SPEC v1.5) : toute valeur commençant par un chiffre est quotée
# explicitement ("95 %", "1,8 heures", "21 %") pour éviter le parsing PyYAML int/float.
#
# Champs :
#   id              : identifiant stable
#   question        : énoncé tel que posé à query.py
#   expected_sources: codes attendus en citation (case-insensitive)
#   expected_concepts: termes/notions devant apparaître dans la réponse
#                      - scalaire (string)   → matching sous-chaîne case-insensitive
#                      - liste (synonymes)   → match si AU MOINS un terme de la liste est trouvé
#                      Plafond recommandé : 2-4 synonymes par liste (anti-pattern : >4 → faux positifs)
#   unit            : unité pilote ciblée

